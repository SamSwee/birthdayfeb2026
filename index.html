<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>February Birthday Bash</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;600;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Animated Background Hearts */
        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
            opacity: 0.3;
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.8));
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 105, 180, 0.3);
            border-radius: 30px;
            padding: 60px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.3), inset 0 0 50px rgba(255, 255, 255, 0.05);
            z-index: 10;
        }
        
        .glow-text {
            font-family: 'Pacifico', cursive;
            font-size: 3.5em;
            background: linear-gradient(to right, #ff69b4, #ff1493, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8));
            margin-bottom: 10px;
            line-height: 1.2;
        }
        
        @keyframes shine {
            to { background-position: 200% center; }
        }
        
        .subtitle {
            color: #ffd700;
            font-size: 1.2em;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-weight: 300;
        }
        
        .date-block {
            background: linear-gradient(45deg, #ff1493, #ff69b4);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 30px 5px;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
            transform: rotate(-2deg);
            transition: transform 0.3s;
        }
        
        .date-block:hover {
            transform: rotate(2deg) scale(1.05);
        }
        
        .date-main {
            font-size: 2.5em;
            font-weight: 800;
            display: block;
            line-height: 1;
        }
        
        .date-time {
            font-size: 1.3em;
            margin-top: 5px;
            font-weight: 300;
        }
        
        .section-title {
            color: #ff69b4;
            font-size: 0.9em;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 30px 0 15px;
            border-bottom: 1px solid rgba(255, 105, 180, 0.3);
            padding-bottom: 10px;
        }
        
        .names {
            color: #fff;
            font-size: 1.3em;
            line-height: 1.8;
            font-weight: 300;
        }
        
        .names span {
            display: inline-block;
            margin: 0 10px;
            position: relative;
        }
        
        .names span::after {
            content: '♥';
            color: #ff1493;
            margin-left: 15px;
            font-size: 0.8em;
            vertical-align: middle;
        }
        
        .names span:last-child::after {
            content: '';
        }
        
        .venue {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #ffd700;
            font-size: 1.1em;
        }
        
        .heart-icon {
            font-size: 3em;
            margin: 20px 0;
            animation: pulse 1.5s ease-in-out infinite;
            display: inline-block;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        @media (max-width: 600px) {
            .glow-text { font-size: 2.5em; }
            .container { padding: 40px 20px; }
        }
    </style>
</head>
<body>
    <!-- Floating Hearts -->
    <div class="heart" style="left: 10%; animation-delay: 0s;">💗</div>
    <div class="heart" style="left: 20%; animation-delay: 2s;">💖</div>
    <div class="heart" style="left: 80%; animation-delay: 1s;">💝</div>
    <div class="heart" style="left: 90%; animation-delay: 3s;">💕</div>
    <div class="heart" style="left: 50%; animation-delay: 4s;">♥</div>
    
    <div class="container">
        <div class="subtitle">You Are Invited To</div>
        <div class="glow-text">February Babies<br>Birthday Bash</div>
        <div class="heart-icon">🎂 💝 🎂</div>
        
        <div class="date-block">
            <span class="date-main">FEB 6</span>
            <span class="date-time">FRIDAY 7:30 PM</span>
        </div>
        
        <div class="section-title">Birthday Stars</div>
        <div class="names">
            <span>Vanness</span>
            <span>Sheng Yang</span>
            <span>Adrian Poh</span>
            <span>Caleb</span>
            <span>Francis Lim</span>
            <span>Bertrand</span>
            <span>Owen Lum</span>
        </div>
        
        <div class="venue">
            📍 TBC<br>
            <small>Level 1</small>
        </div>

        <div> 
            <span>RSVP Here: Link</span>
        </div>
    </div>
</body>
</html>
